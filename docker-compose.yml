services:
  # --------------------------------------------------------
  # Banco de Dados: PostgreSQL 16 (Puro)
  # --------------------------------------------------------
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuaSenhaSeguraAqui123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Zabbix Server 7.0 LTS (Postgres)
  # --------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: always
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuaSenhaSeguraAqui123!}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zabbix-alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix-externalscripts:/usr/lib/zabbix/externalscripts
    networks:
      - backend-net
      - frontend-net
    depends_on:
      zabbix-db:
        condition: service_healthy

  # --------------------------------------------------------
  # Zabbix Web Interface (Nginx + PHP)
  # --------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: always
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuaSenhaSeguraAqui123!}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: "America/Sao_Paulo"
      ZBX_SSO_SETTINGS: ${ZBX_SSO_SETTINGS:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./certs:/etc/zabbix/web/certs:ro
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - zabbix-db
      - zabbix-server

  # --------------------------------------------------------
  # Grafana (dashboards a partir dos dados do Zabbix)
  # --------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: zabbix-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      # SSO via OAuth genérico (ex.: Keycloak). Desabilitado por padrão.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GF_AUTH_GENERIC_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GF_AUTH_GENERIC_OAUTH_NAME:-Keycloak}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GF_AUTH_GENERIC_OAUTH_SCOPES:-openid email profile}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GF_AUTH_GENERIC_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GF_AUTH_GENERIC_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GF_AUTH_GENERIC_OAUTH_API_URL:-}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP:-true}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - frontend-net
    depends_on:
      - zabbix-web

networks:
  backend-net:
    driver: bridge
    internal: true # Isolamento total do banco de dados na rede interna
  frontend-net:
    driver: bridge

volumes:
  pgdata:
  zabbix-alertscripts:
  zabbix-externalscripts:
  grafana-data:
